<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter</title>
    <link rel="stylesheet" href="counter.css">
</head>
<body>
    <div class="box">
        <div class="form">
            <div>
                <h2>Counter App</h2>
                <p>Click the buttons below to change the number.</p>
            </div>
            
                <input type="text" class="display" value="0" id="display" readonly>
            
            <div class="buttons">
                <button id="increase">Increase</button>
                <button id="decrease">Decrease</button>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>
    <script src="counter.js"></script>
</body>
</html>
